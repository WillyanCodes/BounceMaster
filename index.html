<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BounceMaster Pro - CRM Completo</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link href="css/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container mt-4">
    <header class="header mb-5">
      <h1>BounceMaster Pro</h1>
      <p>CRM Completo com Clientes, Pagamentos e Suporte IA</p>
    </header>

    <!-- Formulário de Cliente -->
    <div class="card mb-4">
      <div class="card-body">
        <h3>Adicionar Cliente</h3>
        <div class="row g-3">
          <div class="col-md-3"><input type="text" id="nome" class="form-control" placeholder="Nome"></div>
          <div class="col-md-3"><input type="email" id="email" class="form-control" placeholder="Email"></div>
          <div class="col-md-3"><input type="tel" id="telefone" class="form-control" placeholder="Telefone"></div>
          <div class="col-md-3"><button class="btn btn-primary w-100" onclick="adicionarCliente()">Adicionar</button></div>
        </div>
      </div>
    </div>

    <div class="row">
      <!-- Clientes -->
      <div class="col-lg-6 mb-4">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <h3>Clientes Cadastrados</h3>
            <input type="text" id="busca" class="form-control mb-3" placeholder="Buscar..." onkeyup="filtrarClientes()">
            <div id="listaClientes" class="flex-grow-1 overflow-auto"></div>
            <button class="btn btn-success mt-3" onclick="exportarCSV()">Exportar CSV</button>
          </div>
        </div>
      </div>

      <!-- Pagamentos -->
      <div class="col-lg-6 mb-4">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <h3>Pagamentos - Novembro 2025</h3>
            <div class="d-flex justify-content-between mb-3">
              <strong>Total: R$ <span id="totalValor">0</span></strong>
              <span>Pagos: <span id="pagosCount">0</span>/<span id="totalCount">0</span></span>
            </div>
            <div id="listaPagamentos" class="flex-grow-1 overflow-auto"></div>
            <button class="btn btn-warning mt-3" onclick="enviarLembrete()">Lembrete para Pendentes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard + Chat -->
    <div class="row">
      <div class="col-lg-8">
        <div class="card">
          <div class="card-body">
            <h3>Dashboard</h3>
            <div class="row text-center mb-4">
              <div class="col"><div class="stat bg-primary text-white"><h2 id="totalClientes">0</h2><p>Clientes</p></div></div>
              <div class="col"><div class="stat bg-success text-white"><h2 id="clientesPagos">0</h2><p>Pagos</p></div></div>
              <div class="col"><div class="stat bg-warning text-white"><h2 id="clientesPendentes">0</h2><p>Pendentes</p></div></div>
            </div>
            <canvas id="grafico" height="100"></canvas>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card chat">
          <div class="card-header bg-primary text-white">Chat com IA</div>
          <div id="mensagens" class="messages"></div>
          <div class="input-group mt-3">
            <input type="text" id="msgInput" class="form-control" placeholder="Digite...">
            <button class="btn btn-primary" onclick="enviarMensagem()">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/clientes.js"></script>
  <script src="js/pagamentos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
