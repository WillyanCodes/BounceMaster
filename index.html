<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐍 Snake Game Pro - HTML5 Canvas | GitHub Pages</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      font-family: 'Arial', sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      color: white; 
    }
    .game-container { 
      text-align: center; 
      background: rgba(0,0,0,0.3); 
      padding: 30px; 
      border-radius: 20px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
    }
    canvas { 
      border: 5px solid #fff; 
      border-radius: 10px; 
      background: #000; 
      display: block; 
      margin: 20px auto; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
    }
    h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 0 0 20px #fff; }
    .score { font-size: 1.5em; margin: 10px 0; }
    .instructions { 
      margin-top: 20px; 
      font-size: 1.1em; 
      opacity: 0.9; 
    }
    .game-over { 
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.9); 
      padding: 40px; 
      border-radius: 20px; 
      text-align: center; 
      display: none; 
    }
    .restart-btn { 
      background: #4CAF50; 
      color: white; 
      border: none; 
      padding: 15px 30px; 
      font-size: 1.2em; 
      border-radius: 10px; 
      cursor: pointer; 
      margin-top: 20px; 
      transition: 0.3s; 
    }
    .restart-btn:hover { background: #45a049; transform: scale(1.05); }
    .high-score { color: #FFD700; font-size: 1.3em; }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>🐍 Snake Game Pro</h1>
    <div class="score">Score: <span id="score">0</span> | High Score: <span id="highScore" class="high-score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="instructions">
      Use ⬅️ ⬆️ ⬇️ ➡️ ou WASD para mover<br>
      Coma 🍎 para crescer e pontuar!
    </div>
  </div>

  <div id="gameOver" class="game-over">
    <h2>Game Over!</h2>
    <p>Score Final: <span id="finalScore">0</span></p>
    <button class="restart-btn" onclick="restartGame()">Jogar Novamente</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [
      {x: 10, y: 10}
    ];
    let food = {};
    let dx = 0;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('highScore') || 0;
    let gameRunning = true;

    document.getElementById('highScore').textContent = highScore;

    // Gerar comida aleatória
    function randomFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      // Evita comida na cobra
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) {
          randomFood();
          return;
        }
      }
    }
    randomFood();

    // Desenhar
    function drawGame() {
      // Limpa canvas
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Move cobra
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};
      snake.unshift(head);

      // Verifica comida
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        randomFood();
      } else {
        snake.pop();
      }

      // Desenha cobra
      ctx.fillStyle = '#4CAF50';
      for (let segment of snake) {
        ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
      }

      // Desenha comida
      ctx.fillStyle = '#FF0000';
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 1, 0, 2 * Math.PI);
      ctx.fill();

      // Colisões
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }
      for (let segment of snake.slice(1)) {
        if (head.x === segment.x && head.y === segment.y) {
          gameOver();
          return;
        }
      }
    }

    // Controles
    document.addEventListener('keydown', changeDirection);
    function changeDirection(event) {
      const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40,
            A = 65, W = 87, D = 68, S = 83;
      const key = event.keyCode;
      if ((key === LEFT || key === A) && dx !== 1) { dx = -1; dy = 0; }
      else if ((key === UP || key === W) && dy !== 1) { dx = 0; dy = -1; }
      else if ((key === RIGHT || key === D) && dx !== -1) { dx = 1; dy = 0; }
      else if ((key === DOWN || key === S) && dy !== -1) { dx = 0; dy = 1; }
    }

    // Game Over
    function gameOver() {
      gameRunning = false;
      document.getElementById('finalScore').textContent = score;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('highScore', highScore);
        document.getElementById('highScore').textContent = highScore;
      }
      document.getElementById('gameOver').style.display = 'block';
    }

    // Restart
    function restartGame() {
      snake = [{x: 10, y: 10}];
      dx = 0;
      dy = 0;
      score = 0;
      document.getElementById('score').textContent = 0;
      document.getElementById('gameOver').style.display = 'none';
      gameRunning = true;
      randomFood();
    }

    // Game Loop
    function gameLoop() {
      if (gameRunning) {
        drawGame();
      }
      setTimeout(gameLoop, 150); // Velocidade do jogo
    }

    // Inicia com espaço ou clique
    canvas.addEventListener('click', () => {
      if (dx === 0 && dy === 0) {
        dx = 1;
        dy = 0;
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.keyCode === 32 && dx === 0 && dy === 0) { // Espaço
        dx = 1;
        dy = 0;
      }
    });

    gameLoop();
  </script>
</body>
</html>
