<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Memória</title>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #f0f4f8;
        margin: 0;
        padding: 50px 10px;
    }
    h1 { color: #333; margin-bottom: 10px; text-align: center; }
    .scoreboard {
        margin-bottom: 20px;
        font-size: 18px;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(4, 100px);
        grid-gap: 15px;
    }
    .card {
        width: 100px;
        height: 100px;
        background: #1e90ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        color: #fff;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.3s;
        user-select: none;
    }
    .card.flipped { background: #fff; color: #333; transform: rotateY(180deg); }
    .card.matched { background: #28a745; color: #fff; cursor: default; }
    button { margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; background: #007bff; color: white; }
    button:hover { background: #0056b3; }
    @media (max-width: 450px) { .grid { grid-template-columns: repeat(3, 80px); grid-gap: 10px; } .card { width: 80px; height: 80px; font-size: 30px; } }
</style>
</head>
<body>
<h1>Jogo da Memória</h1>
<div class="scoreboard">
    Tentativas: <span id="tentativas">0</span> | Pares encontrados: <span id="pares">0</span>/8
</div>
<div class="grid" id="grid"></div>
<button onclick="iniciarJogo()">Reiniciar Jogo</button>

<script>
const grid = document.getElementById('grid');
const tentativasSpan = document.getElementById('tentativas');
const paresSpan = document.getElementById('pares');

let cartas = [];
let primeiraCarta = null;
let segundaCarta = null;
let tentativas = 0;
let paresEncontrados = 0;

// Emojis para cartas
const simbolos = ['🍎','🍌','🍒','🍇','🍉','🍍','🥝','🍓'];

function embaralharArray(array) {
    return array.sort(() => Math.random() - 0.5);
}

function criarCartas() {
    const listaCartas = [...simbolos, ...simbolos]; // pares
    cartas = embaralharArray(listaCartas);
    grid.innerHTML = '';
    cartas.forEach((simbolo, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.simbolo = simbolo;
        card.addEventListener('click', () => virarCarta(card));
        grid.appendChild(card);
    });
}

function virarCarta(card) {
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
    card.classList.add('flipped');
    card.innerText = card.dataset.simbolo;

    if (!primeiraCarta) {
        primeiraCarta = card;
    } else if (!segundaCarta) {
        segundaCarta = card;
        tentativas++;
        tentativasSpan.innerText = tentativas;

        if (primeiraCarta.dataset.simbolo === segundaCarta.dataset.simbolo) {
            primeiraCarta.classList.add('matched');
            segundaCarta.classList.add('matched');
            paresEncontrados++;
            paresSpan.innerText = paresEncontrados;
            resetarCartas();

            if (paresEncontrados === simbolos.length) {
                setTimeout(() => alert(`Parabéns! Você venceu em ${tentativas} tentativas!`), 100);
            }
        } else {
            setTimeout(() => {
                primeiraCarta.classList.remove('flipped');
                segundaCarta.classList.remove('flipped');
                primeiraCarta.innerText = '';
                segundaCarta.innerText = '';
                resetarCartas();
            }, 800);
        }
    }
}

function resetarCartas() {
    primeiraCarta = null;
    segundaCarta = null;
}

function iniciarJogo() {
    tentativas = 0;
    paresEncontrados = 0;
    tentativasSpan.innerText = tentativas;
    paresSpan.innerText = paresEncontrados;
    criarCartas();
}

// Iniciar automaticamente
iniciarJogo();
</script>
</body>
</html>
