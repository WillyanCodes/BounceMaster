<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BounceMaster Pro - CRM</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="d-flex">
    <!-- MENU LATERAL -->
    <div class="sidebar bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">
      <h4 class="text-center mb-4">BounceMaster</h4>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link text-white active" href="#clientes" onclick="mostrarAba('clientes')">Clientes</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="#pagamentos" onclick="mostrarAba('pagamentos')">Pagamentos</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="#dashboard" onclick="mostrarAba('dashboard')">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="#chat" onclick="mostrarAba('chat')">Chat IA</a></li>
      </ul>
    </div>

    <!-- CONTEÚDO -->
    <div class="content p-4 flex-grow-1">
      <!-- ABA CLIENTES -->
      <div id="aba-clientes" class="aba">
        <h2>Gerenciar Clientes</h2>
        <div class="card p-3 mb-3">
          <div class="row g-2">
            <div class="col"><input id="novo-nome" class="form-control" placeholder="Nome"></div>
            <div class="col"><input id="novo-email" class="form-control" placeholder="Email"></div>
            <div class="col"><input id="novo-tel" class="form-control" placeholder="Telefone"></div>
            <div class="col-auto"><button class="btn btn-success" onclick="adicionarCliente()">Adicionar</button></div>
          </div>
        </div>
        <input type="text" id="busca-cliente" class="form-control mb-3" placeholder="Buscar cliente..." onkeyup="filtrarClientes()">
        <div id="lista-clientes"></div>
      </div>

      <!-- ABA PAGAMENTOS -->
      <div id="aba-pagamentos" class="aba d-none">
        <h2>Pagamentos - Novembro 2025</h2>
        <div id="lista-pagamentos"></div>
        <button class="btn btn-warning mt-3" onclick="enviarLembrete()">Enviar Lembrete</button>
      </div>

      <!-- ABA DASHBOARD -->
      <div id="aba-dashboard" class="aba d-none">
        <h2>Dashboard</h2>
        <div class="row text-center">
          <div class="col"><div class="p-3 bg-primary text-white rounded"><h3 id="total-clientes">0</h3><p>Clientes</p></div></div>
          <div class="col"><div class="p-3 bg-success text-white rounded"><h3 id="clientes-pagos">0</h3><p>Pagos</p></div></div>
          <div class="col"><div class="p-3 bg-warning text-white rounded"><h3 id="clientes-pendentes">0</h3><p>Pendentes</p></div></div>
        </div>
        <canvas id="grafico" class="mt-4"></canvas>
      </div>

      <!-- ABA CHAT -->
      <div id="aba-chat" class="aba d-none">
        <h2>Chat com Assistente IA</h2>
        <div id="chat-mensagens" class="border p-3 mb-3" style="height: 400px; overflow-y: auto; background: #f8f9fa;"></div>
        <div class="input-group">
          <input id="chat-input" class="form-control" placeholder="Digite sua mensagem...">
          <button class="btn btn-primary" onclick="enviarChat()">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
