<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BounceMaster - Suporte IA</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7fa; color: #333; }
    .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    .header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 30px; border-radius: 16px; text-align: center; margin-bottom: 30px; box-shadow: 0 8px 25px rgba(102,126,234,0.3); }
    .header h1 { font-size: 2.5em; margin: 0; }
    .header p { margin: 10px 0 0; opacity: 0.9; font-size: 1.1em; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 25px; }
    @media (min-width: 1024px) { .grid { grid-template-columns: 2fr 1fr; } }
    .card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    .card h2, .card h3 { margin-bottom: 20px; color: #444; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
    .stat-card { text-align: center; padding: 20px; border-radius: 12px; background: #f8f9fc; }
    .stat-card h3 { font-size: 2.2em; margin: 0; font-weight: bold; }
    .stat-card p { margin: 8px 0 0; color: #666; font-size: 0.95em; }
    .chat { display: flex; flex-direction: column; height: 65vh; min-height: 500px; }
    .messages { flex: 1; overflow-y: auto; padding: 15px; background: #f9f9fb; border-radius: 12px; margin-bottom: 15px; }
    .msg { margin: 10px 0; padding: 12px 16px; border-radius: 18px; max-width: 80%; word-wrap: break-word; }
    .user { background: #007bff; color: white; align-self: flex-end; margin-left: auto; }
    .ia { background: #e9ecef; color: #333; align-self: flex-start; }
    .input-area { display: flex; gap: 12px; }
    .input-area input { flex: 1; padding: 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 1em; }
    .input-area button { background: #4CAF50; color: white; border: none; padding: 0 24px; border-radius: 12px; cursor: pointer; font-weight: bold; }
    .input-area button:hover { background: #45a049; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const { PieChart, Pie, Cell, ResponsiveContainer, Legend } = Recharts;

    const ticketsData = [
      { id: 1, cliente: "Maria Silva", assunto: "Erro no login", status: "Em Andamento", data: "12/04" },
      { id: 2, cliente: "João Costa", assunto: "Dúvida sobre pagamento", status: "Resolvido", data: "11/04" },
      { id: 3, cliente: "Ana Souza", assunto: "Reembolso", status: "Aberto", data: "12/04" }
    ];

    const aiResponses = [
      "Entendido! Vou verificar agora.",
      "Me envie mais detalhes.",
      "Em até 5 minutos resolvo.",
      "Chamado aberto.",
      "Priorizado."
    ];

    function App() {
      const [chat, setChat] = useState([{ text: "Olá! Sou o assistente virtual. Como posso ajudar?", sender: "ia" }]);
      const [input, setInput] = useState("");

      const sendMessage = () => {
        if (!input.trim()) return;
        setChat(prev => [...prev, { text: input, sender: "user" }]);
        setTimeout(() => {
          const resposta = aiResponses[Math.floor(Math.random() * aiResponses.length)];
          setChat(prev => [...prev, { text: resposta, sender: "ia" }]);
        }, 800);
        setInput("");
      };

      const statusCount = ticketsData.reduce((acc, t) => {
        acc[t.status] = (acc[t.status] || 0) + 1;
        return acc;
      }, {});

      const chartData = Object.entries(statusCount).map(([name, value]) => ({ name, value }));
      const COLORS = { Aberto: '#3B82F6', 'Em Andamento': '#F59E0B', Resolvido: '#10B981' };

      return (
        <div className="container">
          <div className="header">
            <h1>BounceMaster</h1>
            <p>Suporte Inteligente com Chat IA</p>
          </div>

          <div className="grid">
            <div className="card">
              <h2>Dashboard em Tempo Real</h2>
              <div className="stats">
                <div className="stat-card" style={{ background: '#ebf5ff' }}>
                  <h3 style={{ color: '#3B82F6' }}>{ticketsData.length}</h3>
                  <p>Total de Tickets</p>
                </div>
                <div className="stat-card" style={{ background: '#fff4e6' }}>
                  <h3 style={{ color: '#F59E0B' }}>
                    {ticketsData.filter(t => t.status === 'Em Andamento').length}
                  </h3>
                  <p>Em Andamento</p>
                </div>
                <div className="stat-card" style={{ background: '#e6f9f0' }}>
                  <h3 style={{ color: '#10B981' }}>
                    {ticketsData.filter(t => t.status === 'Resolvido').length}
                  </h3>
                  <p>Resolvidos</p>
                </div>
              </div>
              <ResponsiveContainer width="100%" height={250}>
                <PieChart>
                  <Pie data={chartData} cx="50%" cy="50%" outerRadius={80} label>
                    {chartData.map((entry, i) => (
                      <Cell key={i} fill={COLORS[entry.name]} />
                    ))}
                  </Pie>
                  <Legend />
                </PieChart>
              </ResponsiveContainer>
            </div>

            <div className="card chat">
              <h3>Chat com Assistente IA</h3>
              <div className="messages">
                {chat.map((msg, i) => (
                  <div key={i} className={`msg ${msg.sender}`} style={{
                    alignSelf: msg.sender === 'user' ? 'flex-end' : 'flex-start',
                    marginLeft: msg.sender === 'user' ? 'auto' : '0',
                    marginRight: msg.sender === 'ia' ? 'auto' : '0'
                  }}>
                    {msg.text}
                  </div>
                ))}
              </div>
              <div className="input-area">
                <input
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyPress={e => e.key === 'Enter' && sendMessage()}
                  placeholder="Digite sua mensagem..."
                />
                <button onClick={sendMessage}>Enviar</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
