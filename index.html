<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Simples</title>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }

    .container {
        width: 100%;
        max-width: 1000px;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    form {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
    }

    input, textarea, select, button {
        padding: 10px;
        font-size: 16px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    input, select, textarea {
        flex: 1;
    }

    button {
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #0056b3;
    }

    #pesquisa {
        width: 100%;
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }

    th {
        background: #f0f0f0;
        cursor: pointer;
    }

    tr:hover {
        background-color: #f9f9f9;
    }

    .acoes button {
        margin-right: 5px;
        padding: 5px 10px;
        font-size: 14px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .editar {
        background: #ffc107;
        color: black;
    }

    .excluir {
        background: #dc3545;
        color: white;
    }

    .exportar {
        background: #28a745;
        color: white;
        margin-bottom: 10px;
    }

    @media(max-width:700px) {
        table, th, td {
            font-size: 14px;
        }
        form {
            flex-direction: column;
        }
    }
</style>
</head>
<body>
<div class="container">
    <h1>CRM Simples</h1>
    <form id="formCliente">
        <input type="text" id="nome" placeholder="Nome" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="telefone" placeholder="Telefone">
        <input type="text" id="empresa" placeholder="Empresa">
        <textarea id="observacoes" placeholder="Observações"></textarea>
        <button type="submit">Adicionar Cliente</button>
    </form>

    <input type="text" id="pesquisa" placeholder="Pesquisar por nome ou empresa">

    <button class="exportar" onclick="exportarCSV()">Exportar para CSV</button>

    <table>
        <thead>
            <tr>
                <th onclick="ordenarPor('nome')">Nome</th>
                <th onclick="ordenarPor('email')">Email</th>
                <th onclick="ordenarPor('telefone')">Telefone</th>
                <th onclick="ordenarPor('empresa')">Empresa</th>
                <th>Observações</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="listaClientes"></tbody>
    </table>
</div>

<script>
let clientes = JSON.parse(localStorage.getItem("clientes")) || [];
let ordemAtual = "nome";
let ordemAsc = true;

const form = document.getElementById("formCliente");
const listaClientes = document.getElementById("listaClientes");
const pesquisa = document.getElementById("pesquisa");

function salvarClientes() {
    localStorage.setItem("clientes", JSON.stringify(clientes));
}

function renderizarClientes(filtro = "") {
    listaClientes.innerHTML = "";
    let dados = clientes
        .filter(c =>
            c.nome.toLowerCase().includes(filtro) ||
            c.empresa.toLowerCase().includes(filtro)
        )
        .sort((a, b) => {
            let valA = a[ordemAtual].toLowerCase();
            let valB = b[ordemAtual].toLowerCase();
            return ordemAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        });

    dados.forEach((c, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${c.nome}</td>
            <td>${c.email}</td>
            <td>${c.telefone}</td>
            <td>${c.empresa}</td>
            <td>${c.observacoes}</td>
            <td class="acoes">
                <button class="editar" onclick="editarCliente(${i})">Editar</button>
                <button class="excluir" onclick="excluirCliente(${i})">Excluir</button>
            </td>
        `;
        listaClientes.appendChild(tr);
    });
}

form.addEventListener("submit", e => {
    e.preventDefault();
    const novoCliente = {
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        telefone: document.getElementById("telefone").value,
        empresa: document.getElementById("empresa").value,
        observacoes: document.getElementById("observacoes").value
    };
    clientes.push(novoCliente);
    salvarClientes();
    renderizarClientes();
    form.reset();
});

function editarCliente(index) {
    const c = clientes[index];
    document.getElementById("nome").value = c.nome;
    document.getElementById("email").value = c.email;
    document.getElementById("telefone").value = c.telefone;
    document.getElementById("empresa").value = c.empresa;
    document.getElementById("observacoes").value = c.observacoes;
    clientes.splice(index, 1);
    salvarClientes();
    renderizarClientes();
}

function excluirCliente(index) {
    if (confirm("Deseja realmente excluir este cliente?")) {
        clientes.splice(index, 1);
        salvarClientes();
        renderizarClientes();
    }
}

pesquisa.addEventListener("input", () => renderizarClientes(pesquisa.value.toLowerCase()));

function ordenarPor(campo) {
    if (ordemAtual === campo) {
        ordemAsc = !ordemAsc;
    } else {
        ordemAtual = campo;
        ordemAsc = true;
    }
    renderizarClientes(pesquisa.value.toLowerCase());
}

function exportarCSV() {
    if (clientes.length === 0) {
        alert("Não há clientes para exportar.");
        return;
    }

    const cabecalho = "Nome,Email,Telefone,Empresa,Observações\n";
    const linhas = clientes.map(c =>
        `${c.nome},${c.email},${c.telefone},${c.empresa},${c.observacoes.replace(/,/g, ";")}`
    );
    const conteudo = cabecalho + linhas.join("\n");

    const blob = new Blob([conteudo], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "clientes.csv";
    link.click();
}

renderizarClientes();
</script>
</body>
</html>
