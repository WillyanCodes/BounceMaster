<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BounceMaster - Suporte IA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; }
    .header { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .header h1 { color: #5a67d8; font-weight: bold; }
    .card { border: none; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    .chat-box { height: 500px; display: flex; flex-direction: column; }
    .messages { flex: 1; overflow-y: auto; padding: 15px; background: #f8f9fa; border-radius: 12px; margin-bottom: 15px; }
    .msg { margin: 8px 0; padding: 10px 15px; border-radius: 18px; max-width: 80%; word-wrap: break-word; }
    .user { background: #5a67d8; color: white; align-self: flex-end; margin-left: auto; }
    .ia { background: #e2e8f0; color: #2d3748; align-self: flex-start; }
    .input-group button { border-radius: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header mb-4">
      <h1>BounceMaster</h1>
      <p class="text-muted">Suporte Inteligente com Chat IA</p>
    </div>

    <div class="row g-4">
      <!-- Dashboard -->
      <div class="col-lg-8">
        <div class="card p-4">
          <h3 class="mb-4">Dashboard em Tempo Real</h3>
          <div class="row text-center mb-4">
            <div class="col">
              <div class="p-3 bg-primary bg-opacity-10 rounded">
                <h2 class="text-primary">3</h2>
                <p>Total de Tickets</p>
              </div>
            </div>
            <div class="col">
              <div class="p-3 bg-warning bg-opacity-10 rounded">
                <h2 class="text-warning">1</h2>
                <p>Em Andamento</p>
              </div>
            </div>
            <div class="col">
              <div class="p-3 bg-success bg-opacity-10 rounded">
                <h2 class="text-success">1</h2>
                <p>Resolvidos</p>
              </div>
            </div>
          </div>
          <canvas id="pieChart" height="100"></canvas>
        </div>
      </div>

      <!-- Chat IA -->
      <div class="col-lg-4">
        <div class="card chat-box">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Chat com Assistente IA</h5>
          </div>
          <div class="messages" id="messages">
            <div class="msg ia">Olá! Sou o assistente virtual. Como posso ajudar?</div>
          </div>
          <div class="input-group">
            <input type="text" id="userInput" class="form-control" placeholder="Digite aqui..." />
            <button class="btn btn-primary" onclick="sendMessage()">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Gráfico de Pizza
    const ctx = document.getElementById('pieChart').getContext('2d');
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Aberto', 'Em Andamento', 'Resolvido'],
        datasets: [{
          data: [1, 1, 1],
          backgroundColor: ['#3B82F6', '#F59E0B', '#10B981'],
          borderWidth: 2,
          borderColor: '#fff'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom' } }
      }
    });

    // Chat IA
    const messages = document.getElementById('messages');
    const input = document.getElementById('userInput');
    const responses = [
      "Entendido! Vou verificar agora.",
      "Me envie mais detalhes.",
      "Em até 5 minutos resolvo.",
      "Chamado aberto.",
      "Priorizado."
    ];

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // Mensagem do usuário
      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.textContent = text;
      messages.appendChild(userMsg);

      // Resposta da IA
      setTimeout(() => {
        const iaMsg = document.createElement('div');
        iaMsg.className = 'msg ia';
        iaMsg.textContent = responses[Math.floor(Math.random() * responses.length)];
        messages.appendChild(iaMsg);
        messages.scrollTop = messages.scrollHeight;
      }, 800);

      input.value = '';
      messages.scrollTop = messages.scrollHeight;
    }

    input.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
